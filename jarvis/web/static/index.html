<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #04060b;
    --panel: rgba(13, 20, 33, .72);
    --panel-solid: #0b111d;
    --border: rgba(56, 189, 248, .18);
    --cyan: #22d3ee;
    --cyan-bright: #7df9ff;
    --violet: #818cf8;
    --text: #dbeafe;
    --text-dim: #7d92b3;
    --danger: #f43f5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    overflow: hidden;
  }

  #net { position: fixed; inset: 0; z-index: 0; display: block; }

  header {
    position: relative; z-index: 2;
    padding: 14px 18px; background: linear-gradient(180deg, rgba(5,9,18,.9), rgba(5,9,18,.55));
    border-bottom: 1px solid var(--border); backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 10px;
  }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 8px 2px var(--cyan); animation: blink 2.4s ease-in-out infinite;
  }
  header .title {
    font-weight: 700; letter-spacing: 3px; font-size: 15px;
    background: linear-gradient(90deg, var(--cyan-bright), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .status { margin-left: auto; font-size: 11px; color: var(--text-dim); letter-spacing: .5px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  #login {
    position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center;
  }
  #login .core { width: 84px; height: 84px; margin-bottom: 6px; }
  #login h2 {
    margin: 0; font-size: 22px; letter-spacing: 4px; font-weight: 700;
    background: linear-gradient(90deg, var(--cyan-bright), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #login p { margin: -8px 0 0; color: var(--text-dim); font-size: 13px; }
  #login input {
    width: 100%; max-width: 320px; padding: 13px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px;
    backdrop-filter: blur(8px);
  }
  #login input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
  #login button {
    width: 100%; max-width: 320px; padding: 13px; border-radius: 12px; border: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(34,211,238,.25), rgba(129,140,248,.25));
    color: var(--cyan-bright); font-weight: 700; font-size: 15px; letter-spacing: 1px;
  }

  #app { position: relative; z-index: 2; display: none; flex-direction: column; flex: 1; min-height: 0; }
  #app.visible { display: flex; }

  #coreWrap { display: flex; justify-content: center; padding: 14px 0 4px; }
  .core { position: relative; width: 56px; height: 56px; }
  .core .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(34,211,238,.35);
    animation: spin 6s linear infinite;
  }
  .core .ring.r2 { inset: -10px; border-color: rgba(129,140,248,.25); animation-duration: 9s; animation-direction: reverse; }
  .core .orb {
    position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--cyan-bright), var(--cyan) 45%, var(--violet) 100%);
    box-shadow: 0 0 18px 4px rgba(34,211,238,.55), 0 0 40px 10px rgba(129,140,248,.25);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .core.thinking .orb { animation: breathe 1s ease-in-out infinite; }
  .core.thinking .ring { animation-duration: 1.6s; }
  .core.listening .orb {
    background: radial-gradient(circle at 35% 30%, #ffd1d9, var(--danger) 45%, #7f1d1d 100%);
    box-shadow: 0 0 18px 4px rgba(244,63,94,.6), 0 0 40px 10px rgba(244,63,94,.25);
    animation: breathe .7s ease-in-out infinite;
  }
  .core.listening .ring { border-color: rgba(244,63,94,.4); animation-duration: 1.2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(.85); opacity: .85; } 50% { transform: scale(1.05); opacity: 1; } }

  #chat { flex: 1; overflow-y: auto; padding: 10px 14px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .msg {
    max-width: 82%; min-width: 0; align-self: flex-start; padding: 11px 15px; border-radius: 16px;
    line-height: 1.4; white-space: pre-wrap; overflow-wrap: break-word; font-size: 14.5px;
    backdrop-filter: blur(6px);
  }
  .user {
    align-self: flex-end; color: #04121a; border-bottom-right-radius: 4px;
    background: linear-gradient(135deg, var(--cyan-bright), var(--cyan));
    box-shadow: 0 0 14px rgba(34,211,238,.25);
  }
  .bot {
    align-self: flex-start; color: var(--text); border-bottom-left-radius: 4px;
    background: var(--panel); border: 1px solid var(--border);
  }

  form {
    position: relative; z-index: 2;
    display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(5,9,18,.92), rgba(5,9,18,.6)); border-top: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  input[type=text] {
    flex: 1; padding: 12px 16px; border-radius: 22px; border: 1px solid var(--border);
    background: var(--panel-solid); color: var(--text); font-size: 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--cyan); }
  button[type=submit] {
    padding: 0 20px; border-radius: 22px; border: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(34,211,238,.3), rgba(129,140,248,.3));
    color: var(--cyan-bright); font-weight: 700; font-size: 14px; letter-spacing: .5px;
  }
  #micBtn {
    width: 44px; height: 44px; flex: none; padding: 0; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel-solid); color: var(--cyan-bright);
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  #micBtn.recording {
    background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.5); color: #ffd1d9;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  .hidden { display: none !important; }

  #overlay {
    position: fixed; inset: 0; z-index: 10; background: rgba(2,4,9,.75); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #overlay .card {
    background: var(--panel-solid); border: 1px solid var(--border); padding: 22px;
    border-radius: 16px; max-width: 90%; text-align: center; box-shadow: 0 0 40px rgba(34,211,238,.12);
  }
  #overlay .label { color: var(--text-dim); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  #overlay .desc { margin-top: 8px; font-weight: 600; color: var(--cyan-bright); }
  #overlay .actions { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
  #overlay button { padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border); font-weight: 700; }
  #overlay button.yes { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #04121a; }
  #overlay button.no { background: transparent; color: var(--text-dim); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(34,211,238,.25); border-radius: 3px; }
</style>
</head>
<body>

<canvas id="net"></canvas>

<div id="login">
  <div class="core"><div class="ring"></div><div class="ring r2"></div><div class="orb"></div></div>
  <h2>JARVIS</h2>
  <p>Ingresa tu token de acceso</p>
  <input id="tokenInput" type="password" placeholder="Token de acceso" autocomplete="off">
  <button id="loginBtn">Entrar</button>
</div>

<div id="app">
  <header>
    <span class="dot"></span>
    <span class="title">JARVIS</span>
    <span class="status" id="statusText">en línea</span>
  </header>
  <div id="coreWrap">
    <div class="core" id="core"><div class="ring"></div><div class="ring r2"></div><div class="orb"></div></div>
  </div>
  <div id="chat"></div>
  <form id="form">
    <button type="button" id="micBtn">🎤</button>
    <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
// --- Fondo de red neuronal animada ---
(function () {
  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  let w, h, nodes;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.max(24, Math.min(60, Math.floor((w * h) / 22000)));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
    }));
  }
  window.addEventListener("resize", resize);
  resize();

  const LINK_DIST = 140;

  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
    }
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          ctx.strokeStyle = `rgba(34,211,238,${(1 - dist / LINK_DIST) * .18})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const n of nodes) {
      ctx.fillStyle = "rgba(125,249,255,.55)";
      ctx.beginPath(); ctx.arc(n.x, n.y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("jarvis_token") || "";

function authHeaders() {
  return { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
}

function setCoreState(state) {
  const core = $("core");
  if (!core) return;
  core.classList.remove("thinking", "listening");
  if (state) core.classList.add(state);
  $("statusText").textContent = state === "thinking" ? "procesando..." : state === "listening" ? "escuchando..." : "en línea";
}

function addMsg(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  $("chat").appendChild(el);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.add("visible");
}

if (token) showApp();

$("loginBtn").onclick = () => {
  const value = $("tokenInput").value.trim();
  if (!value) return;
  token = value;
  localStorage.setItem("jarvis_token", token);
  showApp();
};

let pendingTimer = null;

function startPendingWatch() {
  if (pendingTimer) return;
  pendingTimer = setInterval(async () => {
    try {
      const res = await fetch("/api/pending", { headers: authHeaders() });
      const data = await res.json();
      if (data.desc) {
        clearInterval(pendingTimer);
        pendingTimer = null;
        showConfirm(data.desc);
      }
    } catch (e) {}
  }, 700);
}

function stopPendingWatch() {
  if (pendingTimer) {
    clearInterval(pendingTimer);
    pendingTimer = null;
  }
}

function showConfirm(desc) {
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="card">
      <div class="label">JARVIS quiere ejecutar</div>
      <div class="desc">${desc.replace(/</g, "&lt;")}</div>
      <div class="actions">
        <button class="yes">Sí</button>
        <button class="no">No</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const respond = async (approved) => {
    overlay.remove();
    await fetch("/api/confirm", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ approved }),
    });
    startPendingWatch();
  };
  overlay.querySelector(".yes").onclick = () => respond(true);
  overlay.querySelector(".no").onclick = () => respond(false);
}

async function speak(text) {
  if (!text) return;
  try {
    const res = await fetch("/api/tts", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ text }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => URL.revokeObjectURL(url);
    await audio.play();
  } catch (e) {}
}

async function sendMessage(text) {
  if (!text) return;
  $("input").value = "";
  addMsg(text, "user");
  startPendingWatch();
  setCoreState("thinking");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ message: text }),
    });
    stopPendingWatch();
    if (res.status === 401) {
      addMsg("Token inválido. Recarga la página e ingresa de nuevo.", "bot");
      localStorage.removeItem("jarvis_token");
      setCoreState(null);
      return;
    }
    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      addMsg(`El servidor respondió algo inesperado (HTTP ${res.status}).`, "bot");
      setCoreState(null);
      return;
    }
    const reply = data.reply || "(sin respuesta)";
    addMsg(reply, "bot");
    setCoreState(null);
    speak(reply);
  } catch (err) {
    stopPendingWatch();
    addMsg("Error de conexión con JARVIS (no se pudo contactar al servidor).", "bot");
    setCoreState(null);
  }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  sendMessage($("input").value.trim());
};

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognitionImpl) {
  const recognition = new SpeechRecognitionImpl();
  recognition.lang = "es-ES";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let recording = false;

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) sendMessage(text);
  };
  recognition.onerror = () => {
    recording = false;
    $("micBtn").classList.remove("recording");
    setCoreState(null);
  };
  recognition.onend = () => {
    recording = false;
    $("micBtn").classList.remove("recording");
  };

  $("micBtn").onclick = () => {
    if (recording) {
      recognition.stop();
      return;
    }
    recording = true;
    $("micBtn").classList.add("recording");
    setCoreState("listening");
    recognition.start();
  };
} else {
  $("micBtn").disabled = true;
  $("micBtn").title = "Reconocimiento de voz no soportado en este navegador";
}
</script>
</body>
</html>
