<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e6e6; display: flex; flex-direction: column;
  }
  header { padding: 14px 16px; background: #161a22; border-bottom: 1px solid #262b36; font-weight: 600; letter-spacing: .5px; }

  #login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  #login h2 { margin: 0 0 8px; }
  #login input { width: 100%; max-width: 320px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3040; background: #161a22; color: #e6e6e6; font-size: 16px; }
  #login button { width: 100%; max-width: 320px; padding: 12px; border-radius: 10px; border: none; background: #2563eb; color: white; font-weight: 600; font-size: 15px; }

  #app { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #app.visible { display: flex; }

  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1f2430; border-bottom-left-radius: 4px; }

  form { display: flex; gap: 8px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #161a22; border-top: 1px solid #262b36; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #2a3040;
    background: #0f1115; color: #e6e6e6; font-size: 16px;
  }
  button[type=submit] {
    padding: 0 18px; border-radius: 20px; border: none; background: #2563eb; color: white;
    font-weight: 600; font-size: 15px;
  }

  .hidden { display: none !important; }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #overlay .card { background: #161a22; padding: 20px; border-radius: 14px; max-width: 90%; text-align: center; }
  #overlay .actions { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
  #overlay button { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; }
  #overlay button.yes { background: #2563eb; color: white; }
  #overlay button.no { background: #3a3f4a; color: white; }
</style>
</head>
<body>

<div id="login">
  <h2>JARVIS</h2>
  <input id="tokenInput" type="password" placeholder="Token de acceso" autocomplete="off">
  <button id="loginBtn">Entrar</button>
</div>

<div id="app">
  <header>JARVIS</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("jarvis_token") || "";

function authHeaders() {
  return { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
}

function addMsg(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  $("chat").appendChild(el);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.add("visible");
}

if (token) showApp();

$("loginBtn").onclick = () => {
  const value = $("tokenInput").value.trim();
  if (!value) return;
  token = value;
  localStorage.setItem("jarvis_token", token);
  showApp();
};

let pendingTimer = null;

function startPendingWatch() {
  if (pendingTimer) return;
  pendingTimer = setInterval(async () => {
    try {
      const res = await fetch("/api/pending", { headers: authHeaders() });
      const data = await res.json();
      if (data.desc) {
        clearInterval(pendingTimer);
        pendingTimer = null;
        showConfirm(data.desc);
      }
    } catch (e) {}
  }, 700);
}

function stopPendingWatch() {
  if (pendingTimer) {
    clearInterval(pendingTimer);
    pendingTimer = null;
  }
}

function showConfirm(desc) {
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="card">
      <div>JARVIS quiere ejecutar:</div>
      <div style="margin-top:8px;font-weight:600">${desc.replace(/</g, "&lt;")}</div>
      <div class="actions">
        <button class="yes">Sí</button>
        <button class="no">No</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const respond = async (approved) => {
    overlay.remove();
    await fetch("/api/confirm", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ approved }),
    });
    startPendingWatch();
  };
  overlay.querySelector(".yes").onclick = () => respond(true);
  overlay.querySelector(".no").onclick = () => respond(false);
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  addMsg(text, "user");
  startPendingWatch();
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ message: text }),
    });
    stopPendingWatch();
    if (res.status === 401) {
      addMsg("Token inválido. Recarga la página e ingresa de nuevo.", "bot");
      localStorage.removeItem("jarvis_token");
      return;
    }
    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      addMsg(`El servidor respondió algo inesperado (HTTP ${res.status}).`, "bot");
      return;
    }
    addMsg(data.reply || "(sin respuesta)", "bot");
  } catch (err) {
    stopPendingWatch();
    addMsg("Error de conexión con JARVIS (no se pudo contactar al servidor).", "bot");
  }
};
</script>
</body>
</html>
